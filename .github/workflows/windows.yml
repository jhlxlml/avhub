name: Windows desktop CI and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Validate release tag before downloading tools
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import runpy,os;runpy.run_path('scripts/ci-prepare.py')['validate_release'](os.environ['RELEASE_TAG'])"
      - name: Prepare pinned FFmpeg
        run: python scripts/ci-prepare.py
      - name: Install locked/tested dependencies
        run: |
          python -m pip install -r requirements-ci.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci
      - name: Install and verify pinned Electron runtime
        run: |
          node node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node -e "const fs=require('node:fs'),assert=require('node:assert/strict');const version=require('./node_modules/electron/package.json').version;assert.ok(fs.existsSync('node_modules/electron/dist/electron.exe'),'Electron runtime missing');assert.equal(fs.readFileSync('node_modules/electron/dist/version','utf8').trim(),version,'Electron runtime version mismatch');console.log('Electron runtime verified: '+version)"
      - name: Build shared UI and Electron
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:electron
      - name: Backend regression
        run: python -m unittest discover -s tests -p test_*.py
      - name: Windows short-path regression
        run: python tests/check_path_alias.py
      - name: Shared renderer regression
        run: npx playwright test tests/ui/desktop-policy.spec.ts tests/ui/favorite-stability.spec.ts tests/ui/directory-tree.spec.ts tests/ui/help.spec.ts tests/ui/manual-updates.spec.ts tests/ui/screenshots.spec.ts tests/ui/library-transitions.spec.ts tests/ui/player-control-idle.spec.ts
      - name: Windows short-path screenshot regression
        run: python tests/check_path_alias.py --ui
      - name: Real Electron startup/exit
        run: node electron/test/smoke.mjs
      - name: Startup trace unit regression
        run: node electron/test/startup-trace.mjs
      - name: Real Electron pure playback pin regression
        run: node electron/test/pure-pin.mjs
      - name: Package only tags or explicit manual runs
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-windows.ps1 -SkipDependencyInstall
      - name: Actual portable EXE acceptance
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: node electron/test/portable-release.mjs
      - name: Actual extracted folder ZIP acceptance
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: node electron/test/portable-release.mjs --folder
      - name: Checksums and source manifest
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: python scripts/ci-artifacts.py
      - name: Save verified release files
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-portable-${{ github.sha }}
          path: |
            dist/electron/AVHub-portable-*-x64.exe
            dist/electron/AVHub-folder-portable-*-x64.zip
            dist/electron/SHA256SUMS.txt
            dist/electron/release-build.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'jhlxlml/avhub'
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.11'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-portable-${{ github.sha }}
          path: dist/electron
      - name: Verify and publish without a personal token
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONUTF8: '1'
        run: python scripts/publish-release.py --publish --ci
