name: Windows desktop regression

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mpv_validation:
        description: 'Run optional MPV runtime regression only; do not package or publish'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-2025
    # Source regressions only. Desktop artifacts and Releases are prepared locally.
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Validate release tag before downloading tools
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && !inputs.mpv_validation)
        shell: pwsh
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: python -c "import runpy,os,json;runpy.run_path('scripts/ci-prepare.py')['validate_release'](os.environ.get('RELEASE_TAG') or 'v'+json.load(open('package.json'))['version'])"
      - name: Prepare pinned FFmpeg
        run: python scripts/ci-prepare.py
      - name: Prepare hash-pinned native FFI test closure
        # Contract tests use the exact archive/file pins, not a developer's package.
        run: python scripts/prepare-render-ffi.py
      - name: Prepare and verify pinned private SQLite
        run: |
          python scripts/prepare-sqlite.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/python-runtime.py --check
      - name: Install locked/tested dependencies
        run: |
          python -m pip install -r requirements-ci.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci
      - name: Audit locked JavaScript dependencies
        # Known moderate/high/critical findings must not silently reach a release.
        run: npm audit --audit-level=moderate
      - name: Install and verify pinned Electron runtime
        run: |
          node node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node -e "const fs=require('node:fs'),assert=require('node:assert/strict');const version=require('./node_modules/electron/package.json').version;assert.ok(fs.existsSync('node_modules/electron/dist/electron.exe'),'Electron runtime missing');assert.equal(fs.readFileSync('node_modules/electron/dist/version','utf8').trim(),version,'Electron runtime version mismatch');console.log('Electron runtime verified: '+version)"
      - name: Build shared UI and Electron
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:electron
      - name: Backend regression
        run: npm run test:backend
      - name: Native playback control queue regression (no runtime download)
        run: |
          node electron/test/mpv-client.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node electron/test/native-audio.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node electron/test/native-startup-failure.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node electron/test/native-coordination.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test electron/test/playback-clock.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test electron/test/native-recovery.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node electron/test/independent-coordination.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test electron/test/native-theme.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test electron/test/native-runtime.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test electron/test/mpv-readiness.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test electron/test/mpv-candidate-materials.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test electron/test/playback-engine.test.mjs electron/test/playback-session-coordinator.test.mjs electron/test/chromium-session.test.mjs electron/test/independent-session.test.mjs electron/test/native-open-intent.test.mjs electron/test/release-evidence.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --test electron/test/mpv-engine.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test electron/test/render-api/source-contract.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test electron/test/render-api/display-contract.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test electron/test/render-api/hdr-math.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test electron/test/render-api/hdr-color-reference.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test electron/test/render-api/soak-summary.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test electron/test/render-api/resource-convergence.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test electron/test/render-api/command-bridge.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test electron/test/render-api/win32-handle-owner.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test electron/test/render-api/runtime-attestation.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test electron/test/render-api/cohort-evidence.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node electron/test/render-api/native-budget-test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node electron/test/native-track-memory.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node electron/test/library-soak-report.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node electron/test/no-inspector-report.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node electron/test/help-contract.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node electron/test/chromium-diagnostics.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test --test-timeout=10000 electron/test/media-memory-barrier.test.mjs electron/test/playback-timeline.test.mjs electron/test/steady-frame-observation.test.mjs electron/test/chromium-library-cycle.test.mjs electron/test/stylesheet-ownership.test.mjs electron/test/memory-resource-probe.test.mjs electron/test/theme-palette.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test --test-timeout=10000 electron/test/file-preview.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node electron/test/window-bounds.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node electron/test/process-diagnostics.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node electron/test/native-embedding.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-mpv-readiness.mjs --manifest-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node electron/test/build-dependency-policy.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test --test-timeout=15000 electron/test/build-toolchain-compatibility.test.mjs
      - name: Windows short-path regression
        # Full suite under a real 8.3 alias; unavailable is NOT accepted as a pass.
        run: npm run test:backend:short-path
      - name: Shared renderer regression
        run: npx playwright test tests/ui/desktop-policy.spec.ts tests/ui/favorite-stability.spec.ts tests/ui/directory-tree.spec.ts tests/ui/help.spec.ts tests/ui/manual-updates.spec.ts tests/ui/update-result-banner.spec.ts tests/ui/screenshots.spec.ts tests/ui/library-transitions.spec.ts tests/ui/player-control-idle.spec.ts tests/ui/mouse-seek.spec.ts tests/ui/chromium-diagnostics.spec.ts
      - name: Windows short-path screenshot regression
        # Shared renderer tests are harnesses, not browser product acceptance.
        run: python tests/check_path_alias.py --ui --require-alias
      - name: Remaining renderer regression harnesses
        # Automatically includes new specs omitted from the focused groups.
        run: python scripts/test-renderer-remaining.py
      - name: Read-only route recovery and desktop runtime messages
        run: npx playwright test tests/ui/route-recovery.spec.ts tests/ui/native-runtime-message.spec.ts tests/ui/native-session-settings.spec.ts tests/ui/chromium-session.spec.ts tests/ui/progress-save.spec.ts
      - name: Renderer interaction and theme regression harness
        run: npx playwright test tests/ui/interaction-refinement.spec.ts tests/ui/controls-hover.spec.ts tests/ui/player-space.spec.ts tests/ui/ui-refinement.spec.ts tests/ui/design-system.spec.ts tests/ui/interaction-system.spec.ts tests/ui/playlists-design.spec.ts tests/ui/shutdown.spec.ts tests/ui/external-player-button.spec.ts tests/ui/media-menu-position.spec.ts tests/ui/file-management.spec.ts tests/ui/batch-recycle.spec.ts
      - name: Renderer Mira and interaction convergence harnesses
        # Component/decoder harnesses; real desktop acceptance remains below.
        run: npx playwright test tests/ui/borderless-controls.spec.ts tests/ui/content-feedback.spec.ts tests/ui/dialog-layout.spec.ts tests/ui/directory-detail-polish.spec.ts tests/ui/directory-settings.spec.ts tests/ui/form-hints.spec.ts tests/ui/mira-design.spec.ts tests/ui/mira-followup.spec.ts tests/ui/mira-navigation.spec.ts tests/ui/pagination-layout.spec.ts tests/ui/queue-feedback.spec.ts tests/ui/settings-consistency.spec.ts tests/ui/settings-scroll.spec.ts tests/ui/workspace-consistency.spec.ts
      - name: Lossless delivery and playback recovery renderer harnesses
        run: npx playwright test tests/ui/indexed-remux.spec.ts tests/ui/native-quality.spec.ts tests/ui/fullscreen-icon.spec.ts tests/ui/player-wheel.spec.ts tests/ui/playlist-notice.spec.ts tests/ui/ts-startup.spec.ts
      - name: Recycle records and filter containment renderer harnesses
        run: npx playwright test tests/ui/recycle-records.spec.ts tests/ui/library-refinement.spec.ts tests/ui/source-changes.spec.ts tests/ui/thumbnail-viewport.spec.ts tests/ui/recent-recycle.spec.ts tests/ui/native-player-controls.spec.ts tests/ui/native-launch-lifecycle.spec.ts tests/ui/cover-cache.spec.ts tests/ui/media-playback-memory.spec.ts tests/ui/library-polish.spec.ts tests/ui/workspace-polish.spec.ts tests/ui/player-polish.spec.ts
      - name: Real Electron startup/exit
        run: node electron/test/smoke.mjs
      - name: Real Electron failed startup cleanup (owned backend tree)
        run: node electron/test/startup-failure.mjs
      - name: Real Electron read recovery and original diagnostic export
        run: node electron/test/route-recovery.mjs
      - name: Startup trace unit regression
        run: node electron/test/startup-trace.mjs
      - name: Canonical desktop icon and filter renderer harness
        run: |
          node electron/test/icon.mjs
          npx playwright test tests/ui/brand-filters.spec.ts
      - name: Real Electron repeated startup with interrupted scans
        run: node electron/test/startup-restarts.mjs
      - name: Real Electron pure playback pin regression
        run: node electron/test/pure-pin.mjs
      - name: Real Electron mouse side-button seeking
        run: node electron/test/mouse-seek.mjs
      - name: Real Electron cover external player dispatch
        run: node electron/test/external-player-button.mjs
      - name: Owned TEMP path normalization regression
        run: node electron/test/owned-temp-workspace-policy.mjs
      - name: Real Electron opt-in file organization with owned TEMP samples
        run: node electron/test/file-management.mjs
      - name: Real Electron cancellable file preflight and protected writes
        run: node electron/test/file-preview.mjs
      - name: Native batch recycle safety regression
        run: node electron/test/batch-recycle.mjs
      - name: Native recycle records with isolated owned samples
        run: node electron/test/recycle-records.mjs
      - name: Native recycle toast and recent restoration shortcuts
        run: |
          node electron/test/recycle-shortcuts.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node electron/test/recycle-shortcuts.mjs --read-delay-ms=6000
      - name: Native external file identity and explicit replacement acceptance
        run: node electron/test/media-identity.mjs
      - name: Real Electron external removal refresh and restoration
        run: node electron/test/external-removal.mjs
      - name: Deferred settings renderer harness
        run: npx playwright test tests/ui/lazy-settings.spec.ts tests/ui/missing-artwork.spec.ts
      - name: Theme appearance renderer harness
        run: npx playwright test tests/ui/themes.spec.ts tests/ui/appearance.spec.ts tests/ui/style-ownership.spec.ts
      - name: Native text editing menu regression
        run: |
          node electron/test/text-edit-menu-policy.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node electron/test/text-edit-menu.mjs
      - name: Real Electron update result UI regression
        run: node electron/test/update-banner.mjs
      - name: Real Electron library workflows and native exports
        run: node electron/test/library-workflows.mjs
      - name: Real Electron library refinement and playlist batches
        run: node electron/test/library-refinement.mjs
      - name: Real Electron directory removal and permission controls
        run: node electron/test/directory-controls.mjs
      - name: Real Electron theme preview, persistence and media identity
        run: node electron/test/themes.mjs
      - name: Real Electron privacy and bounded resource diagnosis
        run: node electron/test/privacy-memory.mjs
      - name: Real Electron library visual system and compact layouts
        run: node electron/test/library-polish.mjs
      - name: Real Electron storage preflight and active original playback
        run: node electron/test/storage-concurrency.mjs
      - name: Real Electron player visual system and retained source
        run: node electron/test/player-polish.mjs
      - name: Bounded Electron playback scan and thumbnail concurrency smoke
        # One minute CI smoke; manual endurance default is ten minutes.
        run: node electron/test/concurrent-soak.mjs 60
      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/electron-external-removal-*/acceptance.json
            build/electron-external-removal-*/failure.png
            build/electron-external-removal-*/profile/desktop.log
            build/backend-tests/*.log
            build/backend-tests/*.json
            build/recycle-shortcuts-*/acceptance.json
            build/recycle-shortcuts-*/failure.png
            test-results/**
            playwright-report/**
            build/electron-*/**/*.log
            build/electron-startup-restarts-*/acceptance.json
            build/electron-startup-restarts-*/failure.png
            build/electron-storage-concurrency-*/acceptance.json
            build/electron-storage-concurrency-*/failure.png
            build/avhub-directory-controls-*/acceptance.json
            build/avhub-directory-controls-*/*.png
            build/theme-desktop-*/acceptance.json
            build/theme-desktop-*/*.png
            build/avhub-privacy-memory-*/acceptance.json
            build/avhub-privacy-memory-*/failure.png
            build/concurrent-soak-*/soak.json
            build/route-recovery-*/**
            build/startup-failure-*/acceptance.json
            build/startup-failure-*/**/child.json
            build/startup-failure-*/**/*.log
            build/portable-release-test-*/startup-timings.json
            build/folder-release-test-*/startup-timings.json
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 6

  native-runtime:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.mpv_validation
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.11'
      - name: Prepare locked development runtimes (not redistribution approval)
        run: |
          python scripts/ci-prepare.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/prepare-sqlite.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/python-runtime.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements-ci.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run prepare:mpv
      - name: Native runtime regression (not interactive desktop or mixed-DPI acceptance)
        run: |
          npm run test:electron:mpv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node electron/test/native-embedded.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node electron/test/native-startup-recovery.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node electron/test/native-app-flow.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node electron/test/native-theme.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node electron/test/native-engine.mjs
      - name: Prepare fixed MPV candidate in isolated directory
        run: npm run prepare:mpv -- -Candidate
      - name: Fixed MPV candidate application compatibility (not distribution approval)
        env:
          AVHUB_TEST_MPV_CANDIDATE: stable-0.41.0
        run: |
          node electron/test/native-engine.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node electron/test/native-independent.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-runtime-regression-${{ github.sha }}
          path: |
            build/native-player-*/acceptance.json
            build/native-player-*/failure.txt
            build/native-app-flow-*/acceptance.json
            build/native-app-flow-*/failure.json
            build/native-embedded-*/acceptance.json
            build/native-embedded-*/failure.txt
            build/native-theme-*/acceptance.json
            build/native-theme-*/*.png
            build/native-engine-*/acceptance.json
            build/native-engine-*/*.png
            build/native-independent-*/acceptance.json
            build/native-independent-*/failure.json
            build/native-independent-*/runtime-subject.json
          if-no-files-found: warn

